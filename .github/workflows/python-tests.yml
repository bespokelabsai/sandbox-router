name: Python tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Offline tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development and server dependencies
        run: python -m pip install -e '.[dev,server]'
      - name: Run offline suite
        run: >-
          python -m pytest
          --deselect=tests/test_regression.py::TensorlakeRegressionTests
          --deselect=tests/test_regression.py::DaytonaRegressionTests
          --deselect=tests/test_regression.py::E2BRegressionTests
          --deselect=tests/test_regression.py::BoxdRegressionTests
          --deselect=tests/test_regression.py::ModalRegressionTests
          --deselect=tests/test_regression.py::DockerRegressionTests
          --deselect=tests/test_regression.py::SafehouseRegressionTests
          --ignore=tests/test_novita_e2e.py
          --deselect=tests/test_boxd_backend.py::BoxdLiveTests
          -ra

  postgres:
    name: PostgreSQL hosted-job tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Throwaway service container credentials; nothing outside this job.
      SANDBOX_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install development, server, and PostgreSQL dependencies
        run: python -m pip install -e '.[dev,server,postgres]'
      - name: Run hosted-job suite against PostgreSQL
        run: python -m pytest tests/test_hosted_jobs_postgres.py -ra

  lint:
    name: Lint and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install development and server dependencies
        run: python -m pip install -e '.[dev,server]'
      - name: Check lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m pyink --check .
