name: Build and push optional agent images

# Two modes of operation:
#
#   * Push to main  -> build+push :main (mutable dev tag). Library code
#     never references :main; it exists for manual testing.
#
#   * workflow_dispatch -> build+push a caller-selected release tag.
#     Built-in presets install at startup and do not reference these images.
#     Users can opt in through a custom SandboxPreset(image=...).
#
# :sha-<short> is always emitted for audit/rollback.

on:
  push:
    branches: [main]
    paths:
      - "images/**"
  workflow_dispatch:
    inputs:
      image:
        description: "Specific image to build (e.g. codex), or 'all'"
        required: false
        default: "all"
      tag:
        description: "New release tag to publish for optional custom preset images"
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/bespokelabsai/sandbox

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.set-matrix.outputs.images }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: set-matrix
        env:
          INPUT: ${{ github.event.inputs.image }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "$INPUT" == "all" || -z "$INPUT" ]]; then
              # Build all images
              IMAGES=$(ls -d images/*/ | xargs -I{} basename {} | jq -R -s -c 'split("\n") | map(select(. != ""))')
            else
              # Validate single image input: must be a simple basename
              if ! [[ "$INPUT" =~ ^[a-z0-9][a-z0-9_-]*$ ]]; then
                echo "::error::Invalid image name. Must match ^[a-z0-9][a-z0-9_-]*$" >&2
                exit 1
              fi
              # Verify the directory exists
              if [[ ! -d "images/$INPUT" ]]; then
                echo "::error::Image directory 'images/$INPUT' does not exist" >&2
                exit 1
              fi
              # Build JSON array with jq (safe, no manual JSON construction)
              IMAGES=$(jq -cn --arg image "$INPUT" '[$image]')
            fi
          else
            # On push, only build images whose Dockerfile changed
            CHANGED=$(git diff --name-only HEAD~1 HEAD -- images/ | cut -d/ -f2 | sort -u | jq -R -s -c 'split("\n") | map(select(. != ""))')
            if [[ "$CHANGED" == "[]" || "$CHANGED" == '[""]' ]]; then
              IMAGES="[]"
            else
              IMAGES="$CHANGED"
            fi
          fi
          echo "images=$IMAGES" >> "$GITHUB_OUTPUT"

  build:
    needs: detect-changes
    if: needs.detect-changes.outputs.images != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.detect-changes.outputs.images) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          # On workflow_dispatch -> the explicitly selected release tag.
          # On push to main     -> :main (dev tag, never referenced by library).
          # Always emit :sha-<short> for auditability.
          tags: |
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=main,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v5
        with:
          context: images/${{ matrix.image }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
