<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1060" viewBox="0 0 1280 1060" role="img" aria-labelledby="title desc">
<title id="title">Docker, Monty, and Daytona usage and resource visibility</title>
<desc id="desc">Illustrative 24-hour workload, not a product screenshot: 480 sandboxes, 12,480 executions, 720 sandbox-hours. Daytona has 360 hours with 108 idle; Docker has 240 hours with 72 idle; Monty has 120 hours with unavailable resource telemetry and no idle classification. Separately, live smoke tests observed peak CPU of 99.9 percent and RAM of 66.8 MiB for Docker, and 100 percent and 91.3 MiB for Daytona. All six test sandboxes were cleaned up.</desc>
